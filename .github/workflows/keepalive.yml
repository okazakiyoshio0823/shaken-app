# Supabase無料プランは1週間アクセスが無いとDBが止まる（2026年9月に実際に止まった）。
# 長い休みでアプリを使わない間も止まらないよう、3日ごとにRender経由でDBへアクセスする。
# Renderもスリープしているので、起きるまで最大数分待つ。
name: DB keepalive

on:
  schedule:
    - cron: '0 0 */3 * *'   # 3日ごと 9:00（日本時間）
  workflow_dispatch:         # GitHubの画面から手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: RenderとDBにアクセス
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS -m 120 https://shaken-app-server.onrender.com/api/health/db; then
              exit 0
            fi
            echo "応答なし。30秒後にやり直します ($i/5)"
            sleep 30
          done
          echo "DBにアクセスできませんでした。Supabaseが止まっていないか確認してください。"
          exit 1
